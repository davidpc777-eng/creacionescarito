<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creaciones Carito – Trajes de baile, disfraces y más</title>
<style>
:root{--bg:#fff5f9;--card:#fff;--tx:#2a1620;--mut:#7d6572;--bd:#f3d5e3;--ac:#c2185b;--act:#fff;--gold:#d4a017;--brand:#8e1050;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1a0e15;--card:#2a1822;--tx:#f6e9f0;--mut:#b99aab;--bd:#4a2a3b;--ac:#ff6fa8;--act:#2a0a18;--gold:#f2c94c;--brand:#5e0b35;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
header{background:var(--brand);border-bottom:4px solid var(--gold);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:#fff}
.logo{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.6rem;line-height:1.1}
.logo small{display:block;font-family:system-ui,sans-serif;font-style:normal;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--ac);color:var(--act);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
header button.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bd)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.hero{background:linear-gradient(135deg,var(--brand),var(--ac));color:#fff;border-radius:14px;padding:22px 18px;margin-bottom:16px;text-align:center}
.hero h2{margin:0 0 4px;font-family:Georgia,serif;font-style:italic;font-size:1.5rem}.hero p{margin:0;opacity:.95}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card:hover{border-color:var(--gold)}
.ph{aspect-ratio:3/4;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:3.5rem}.ph img{width:100%;height:100%;object-fit:contain}
.bd{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.bd>.wa{margin-top:auto}
.cat{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.name{font-weight:600}.price{font-size:1.25rem;font-weight:700;color:var(--ac)}.rent{font-size:.85rem;color:var(--mut)}
.tag{font-size:.8rem;font-weight:600}.ok{color:var(--ok)}.low{color:var(--warn)}.out{color:var(--bad)}
.wa{text-align:center;text-decoration:none;background:#25D366;color:#062b14;font-weight:600;border-radius:8px;padding:8px;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.wa:hover{background:#20bd5a}.wa svg{width:18px;height:18px;fill:currentColor;flex:none}
.bd>.wa{white-space:nowrap;padding:9px 6px;font-size:.85rem;gap:6px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}.panel h2{margin:0 0 10px;font-size:1rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.form label,.ef label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{font-size:.8rem;color:var(--mut)}
td input[type=number]{width:100%;max-width:100px}.msg{color:var(--mut);padding:24px;text-align:center}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;max-width:520px;width:calc(100% - 24px);max-height:90vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dph{aspect-ratio:3/4;max-height:55vh;margin:0 auto 10px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:4rem}.dph img{width:100%;height:100%;object-fit:contain}
.info{margin:8px 0;display:grid;gap:4px}.info b{color:var(--mut);font-weight:500}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row .wa{flex:1;padding:10px}
.ef{display:grid;gap:8px}
</style>
</head>
<body>
<header>
  <div class="logo">Creaciones Carito<small>Trajes · Disfraces · Tutús · Lencería</small></div>
  <div><button class="ghost" id="btnAdmin">Administrador</button> <button class="ghost" id="btnOut" hidden>Cerrar sesión</button></div>
</header>
<main>
  <div class="hero"><h2>Vístete para brillar</h2><p>Trajes de baile, disfraces, tutús y más. Venta y confección a medida.</p></div>

  <div class="panel" id="login" hidden>
    <h2>Ingreso de administrador</h2>
    <div class="form">
      <label>Correo<input id="em" type="email" autocomplete="username"></label>
      <label>Contraseña<input id="pw" type="password" autocomplete="current-password"></label>
      <button id="go">Ingresar</button>
    </div>
  </div>

  <div id="admin" hidden>
    <div class="panel">
      <h2>Agregar producto</h2>
      <div class="form">
        <label>Nombre<input id="n"></label>
        <label>Categoría<select id="c"></select></label>
        <label>Precio venta (S/)<input id="p" type="number" min="0" step="0.01"></label>
        <label>¿Se confecciona a medida?<select id="r"><option value="no">No</option><option value="si">Sí</option></select></label>
        <label>Stock<input id="s" type="number" min="0" step="1"></label>
        <label>Tallas<input id="sz" placeholder="4, 6, 8 / S, M, L"></label>
        <label>Colores<input id="co" placeholder="Rosado, blanco"></label>
        <label>Foto<input id="img" type="file" accept="image/*"></label>
        <button id="add">Agregar</button>
      </div>
    </div>
    <div class="panel"><h2>Inventario</h2><div class="scroll"><table>
      <thead><tr><th>Producto</th><th>Categoría</th><th>Venta (S/)</th><th>Stock</th><th>Foto</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div></div>
  </div>

  <div class="bar"><input id="q" type="search" placeholder="Buscar producto…"></div>
  <div class="chips" id="chips"></div>
  <div id="msg" class="msg">Cargando catálogo…</div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="det"><div id="detBody"></div></dialog>
<dialog id="edlg">
  <h2 style="margin-top:0;font-size:1.05rem">Detalles del producto</h2>
  <div class="ef">
    <label>Nombre<input id="eName"></label>
    <label>Categoría<select id="eCat"></select></label>
    <label>¿Se confecciona a medida?<select id="eMade"><option value="no">No</option><option value="si">Sí</option></select></label>
    <label>Tallas<input id="eSizes"></label>
    <label>Colores<input id="eColors"></label>
    <label>Descripción<textarea id="eDesc" rows="4"></textarea></label>
  </div>
  <div class="row"><button id="eSave">Guardar</button><button class="ghost" id="eCancel">Cancelar</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== CONFIGURACIÓN: cambia solo estas 3 líneas ====== */
const SUPABASE_URL="https://tzintgrbwuvdduyiicuw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6aW50Z3Jid3V2ZGR1eWlpY3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTI4ODMsImV4cCI6MjEwODcyODg4M30.bcMtid8d__NzS_Xp86fepvmaIiBF-cO3L9aPEvnnpDk";
const WHATSAPP="51943950279"; // código de país + número, sin + ni espacios
/* ======================================================= */
const CATS=["Trajes de baile","Disfraces","Tutús","Lencería","Accesorios"];
const ICON={"Trajes de baile":"💃","Disfraces":"🎭","Tutús":"🩰","Lencería":"🎀","Accesorios":"👑"};
const $=id=>document.getElementById(id);
const WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
const esc=t=>String(t??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const money=v=>"S/ "+Number(v).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const hasWA=/^\d{8,15}$/.test(WHATSAPP);
$("c").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("eCat").innerHTML=$("c").innerHTML;
let sb,items=[],logged=false,showLogin=false,cat="";

function tag(s){return s<=0?'<span class="tag out">Agotado</span>':s<=3?`<span class="tag low">¡Últimas ${s} unidades!</span>`:'<span class="tag ok">Disponible</span>'}
const waLink=x=>hasWA?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola Carito, quiero consultar por: "+x.name)}">${WA_ICON}Consultar por WhatsApp</a>`:"";

function render(){
  $("chips").innerHTML=["",...CATS].map(c=>`<button class="chip${cat===c?" on":""}" data-cat="${esc(c)}">${c||"Todo"}</button>`).join("");
  const q=$("q").value.toLowerCase();
  const list=items.filter(x=>(!cat||x.category===cat)&&x.name.toLowerCase().includes(q));
  $("msg").hidden=list.length>0;if(!list.length)$("msg").textContent="No hay productos para mostrar.";
  $("grid").innerHTML=list.map(x=>`<div class="card" data-open="${x.id}"><div class="ph">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}" loading="lazy">`:(ICON[x.category]||"✨")}</div>
   <div class="bd"><div class="cat">${esc(x.category)}</div><div class="name">${esc(x.name)}</div><div class="price">${money(x.price)}</div>
   ${x.made_to_order?`<div class="rent">✂️ También a medida</div>`:""}${tag(x.stock)}${waLink(x)}</div></div>`).join("");
  $("login").hidden=!(showLogin&&!logged);$("admin").hidden=!logged;
  $("btnAdmin").hidden=logged;$("btnOut").hidden=!logged;
  if(logged)$("tb").innerHTML=items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td>
   <td><input type="number" min="0" step="0.01" value="${x.price}" data-id="${x.id}" data-k="price"></td>
   <td><input type="number" min="0" step="1" value="${x.stock}" data-id="${x.id}" data-k="stock"></td>
   <td><input type="file" accept="image/*" data-img="${x.id}"></td>
   <td><button class="ghost" data-edit="${x.id}">Detalles</button> <button class="del" data-del="${x.id}">Eliminar</button></td></tr>`).join("");
}
async function load(){
  const {data,error}=await sb.from("products").select("*").order("name");
  if(error){$("msg").hidden=false;$("msg").textContent="No se pudo cargar el catálogo.";return}
  items=data;render();
}
async function upload(file){
  if(!file)return null;
  const path=Date.now()+"-"+file.name.replace(/[^\w.-]/g,"_");
  const {error}=await sb.storage.from("products").upload(path,file);
  if(error){alert("Error al subir la foto: "+error.message);return null}
  return sb.storage.from("products").getPublicUrl(path).data.publicUrl;
}
const guard=async fn=>{try{await fn();await load()}catch(e){alert("Error: "+(e.message||e))}};
const numOrNull=v=>{const n=parseFloat(v);return isNaN(n)||n<0?null:n};

$("q").oninput=render;
$("chips").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;render()}};
$("btnAdmin").onclick=()=>{showLogin=true;render()};
$("btnOut").onclick=()=>sb.auth.signOut();
$("go").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)alert("Correo o contraseña incorrectos");
};
$("add").onclick=()=>guard(async()=>{
  const name=$("n").value.trim(),price=parseFloat($("p").value),stock=parseInt($("s").value,10);
  if(!name||isNaN(price)||isNaN(stock)||price<0||stock<0)throw new Error("Completa nombre, precio y stock válidos.");
  const image_url=await upload($("img").files[0]);
  const {error}=await sb.from("products").insert({name,category:$("c").value,price,made_to_order:$("r").value==="si",stock,sizes:$("sz").value.trim(),colors:$("co").value.trim(),image_url});
  if(error)throw error;["n","p","s","sz","co","img"].forEach(i=>$(i).value="");$("r").value="no";
});
$("tb").onchange=e=>{
  const t=e.target;
  guard(async()=>{
    if(t.dataset.img){const url=await upload(t.files[0]);if(!url)return;
      const {error}=await sb.from("products").update({image_url:url}).eq("id",t.dataset.img);if(error)throw error;return}
    const v=parseFloat(t.value);if(!t.dataset.id||isNaN(v)||v<0)return;
    const {error}=await sb.from("products").update({[t.dataset.k]:t.dataset.k==="stock"?Math.floor(v):v}).eq("id",t.dataset.id);if(error)throw error;
  });
};
let editId=null;const det=$("det"),edlg=$("edlg");
$("tb").onclick=e=>{
  const eid=e.target.dataset.edit;
  if(eid){const x=items.find(i=>i.id===eid);if(!x)return;editId=eid;
    $("eName").value=x.name;$("eCat").value=x.category;$("eMade").value=x.made_to_order?"si":"no";$("eSizes").value=x.sizes||"";$("eColors").value=x.colors||"";$("eDesc").value=x.description||"";edlg.showModal();return}
  const id=e.target.dataset.del;
  if(id&&confirm("¿Eliminar este producto?"))guard(async()=>{const {error}=await sb.from("products").delete().eq("id",id);if(error)throw error});
};
$("eCancel").onclick=()=>edlg.close();
$("eSave").onclick=()=>guard(async()=>{
  const name=$("eName").value.trim();if(!name)throw new Error("El nombre no puede estar vacío.");
  const {error}=await sb.from("products").update({name,category:$("eCat").value,made_to_order:$("eMade").value==="si",sizes:$("eSizes").value.trim(),colors:$("eColors").value.trim(),description:$("eDesc").value.trim()}).eq("id",editId);
  if(error)throw error;edlg.close();
});
det.onclick=e=>{if(e.target===det||e.target.dataset.close)det.close()};
$("grid").onclick=e=>{
  if(e.target.closest("a"))return;
  const c=e.target.closest("[data-open]");if(!c)return;
  const x=items.find(i=>i.id===c.dataset.open);if(!x)return;
  $("detBody").innerHTML=`<div class="dph">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}">`:(ICON[x.category]||"✨")}</div>
   <div class="cat">${esc(x.category)}</div><div class="name" style="font-size:1.15rem">${esc(x.name)}</div>
   <div class="price">${money(x.price)}</div>${x.made_to_order?`<div class="rent">✂️ Se confecciona a medida: consúltanos por WhatsApp</div>`:""}${tag(x.stock)}
   <div class="info">${x.sizes?`<div><b>Tallas:</b> ${esc(x.sizes)}</div>`:""}${x.colors?`<div><b>Colores:</b> ${esc(x.colors)}</div>`:""}</div>
   ${x.description?`<p style="white-space:pre-line">${esc(x.description)}</p>`:""}
   <div class="row">${waLink(x)}<button class="ghost" data-close="1">Cerrar</button></div>`;
  det.showModal();
};

if(SUPABASE_URL.startsWith("PEGA")){$("msg").textContent="Falta configurar Supabase (ver instrucciones)."}
else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((_e,session)=>{logged=!!session;render()});
  load();
}
</script>
</body>
</html>
